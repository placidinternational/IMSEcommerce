<!DOCTYPE html>
<html>
<body style="background-color: #222533; padding: 20px; font-family: font-size: 14px; line-height: 1.43; font-family: &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif;">

    <div style="max-width: 600px; margin: 0px auto; background-color: #fff; box-shadow: 0px 20px 50px rgba(0,0,0,0.05);">
        <table style="width: 100%;background-color: #f4c219">
            <tr>
                <td style="background-color: #f4c219; padding:20px 20px">
                    <img src="https://www.prestigeassuranceplc.com/wp-content/uploads/sites/2/2018/03/logo.png" width="150" height="80" alt="PrestigeLogo" style="max-width: 150px;-ms-interpolation-mode: bicubic;vertical-align: middle;border: 0;line-height: 100%;height: auto;outline: none;text-decoration: none;" />
                </td>
                <td style="padding-left: 50px; text-align: right; padding-right: 20px;"></td>
            </tr>
        </table>



        <div style="padding:20px 20px 60px 20px; border-top: 1px solid rgba(0,0,0,0.05);">
            <h4 style="margin-top: 0px;">

                Dear Admin,
            </h4>
            <div style="color: #636363; font-size: 14px;">
                Please see below message from ${senderName} for your action.
            </div>

            <div style="color: #636363; font-size: 14px; margin-top: 30px;">
                Name: <b>${senderName}</b>
            </div>
            <div style="color: #636363; font-size: 14px; margin-top: 10px;">
                Email: <b>${email}</b>
            </div>

            <div style="color: #636363; font-size: 14px; margin-top: 10px;">
                Subject: <b>${subject}</b>
            </div>
            <div style="color: #636363; font-size: 14px; margin-top: 10px;">
                Message: <b>${message}</b>
            </div>


            <br />
            <br />

            <div style="color: #636363; font-size: 14px; margin-top: 30px;">
                Warm regards,
            </div>

            <div style="color: #636363; font-size: 14px; font-style:italic; margin-top: 30px;">
                Authorized and Regulated by The National Insurance Commission RIC - 033
            </div>

        </div>
        <div style="background-color: #fff; padding: 40px; text-align: center;">

        </div>
    </div>
</body>
</html>
