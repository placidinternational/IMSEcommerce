<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Your Account</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f0f4f8;
        }

        .container {
            background-color: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(10, 34, 81, 0.1);
            text-align: center;
        }

        .header {
            margin-bottom: 30px;
        }

            .header h1 {
                color: #0a2251;
            }

        .otp-section {
            background-color: #f0f4f8;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .otp-code {
            font-size: 24px;
            letter-spacing: 4px;
            color: #0a2251;
            font-weight: bold;
        }

        .instructions {
            color: #6b7280;
            margin-bottom: 20px;
        }

        .footer {
            text-align: center;
            color: #6b7280;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Verify Your Account</h1>
            
        </div>

        <div class="otp-section">
            <h3>Email Verification</h3>
            <p>To complete your account setup, please use the following OTP:</p>
            <div class="otp-code">${OtpCode}</div>
            <p>This code will expire in ${expirytime}</p>
        </div>

        <div class="credentials">
            <h3>Your Account Details</h3>
            <p><strong>Email:</strong>${email}</p>
        </div>

        <div class="footer">Powered by <span>Redtech</span> • © 2025</div>
    </div>
</body>
</html>
